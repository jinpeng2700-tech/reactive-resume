name: Publish Production Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable image tag to promote
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Validate immutable tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          [[ "$IMAGE_TAG" =~ ^sha-[0-9a-f]{12}$ || "$IMAGE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-custom\.[0-9]+$ ]]

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Promote reviewed image
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          docker buildx imagetools inspect "${IMAGE}:${IMAGE_TAG}"
          docker buildx imagetools create --tag "${IMAGE}:production" "${IMAGE}:${IMAGE_TAG}"
